kotlin.code.style=official
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
kotlin.daemon.jvmargs=-Xmx2g
# Let configuration succeed on non-macOS hosts (Linux CI/dev), where the iOS Kotlin/Native
# targets are unavailable: the JVM target and commonMain still compile and test there.
kotlin.native.ignoreDisabledTargets=true
